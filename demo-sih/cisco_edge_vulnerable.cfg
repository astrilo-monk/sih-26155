!
! BRANCH-EDGE-RTR01 - Cisco ISR 4331 (IOS-XE)
! Demo configuration for NetAuditAI - intentionally insecure
!
version 16.9
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname BRANCH-EDGE-RTR01
!
boot-start-marker
boot-end-marker
!
! VULN (MGMT-005): enable secret not used, password kept in plaintext / Type 7
enable password Cisco@123
username admin privilege 15 password 7 0822455D0A16
!
! VULN (MGMT-008): no aaa new-model, so no central AAA
no aaa new-model
!
! VULN (BOUNDARY-002): IP source routing left enabled
ip source-route
!
ip domain name branch.example.local
!
! VULN (MGMT-007): SSH version 1 allowed
ip ssh version 1
!
! VULN (MGMT-002): HTTP management server enabled
ip http server
!
interface GigabitEthernet0/0/0
 description WAN-UPLINK-TO-ISP
 ip address 203.0.113.2 255.255.255.252
 ip access-group OUTSIDE-IN in
 no cdp enable
 negotiation auto
!
interface GigabitEthernet0/0/1
 description LAN-USERS
 ip address 10.10.20.1 255.255.255.0
 negotiation auto
!
no cdp run
!
! VULN (BOUNDARY-001): any-to-any permit on the internet-facing ACL
ip access-list extended OUTSIDE-IN
 permit ip any any
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! VULN (MGMT-004): default SNMP community strings
snmp-server community public RO
snmp-server community private RW
!
logging host 10.10.99.50
logging trap informational
!
ntp authentication-key 1 md5 NtpKey2026
ntp authenticate
ntp trusted-key 1
ntp server 10.10.99.10 key 1
!
banner motd ^C
Authorized access only. Activity on this device is monitored and logged.
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
!
! VULN (MGMT-001): Telnet allowed on the VTY lines
! VULN (MGMT-003): no access-class, so management is reachable from anywhere
! VULN (MGMT-006): exec-timeout 0 0 disables the idle timeout
line vty 0 4
 exec-timeout 0 0
 password 7 0822455D0A16
 login
 transport input telnet ssh
!
end
