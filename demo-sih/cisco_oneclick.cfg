!
! HQ-EDGE-RTR02 - Cisco ISR 4431 (IOS-XE 16.9)
! Demo configuration for NetAuditAI: every problem here is fixed by one click, no input needed
!
version 16.9
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname HQ-EDGE-RTR02
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$nhEmQVczB7dqsO$X.HsgL6x1il0RxkOSSvyQYwucySCt7qFm4v7pqCxkKM
username netops privilege 15 secret 9$9$2MJBozw/9R3UsU$8zsCdkqeYLVOSgpBbyGqqGpKPo4/PSZZUcWSRqoG7FI
!
! VULN (MGMT-008): no central AAA
no aaa new-model
!
! VULN (BOUNDARY-002): IP source routing enabled
ip source-route
!
ip domain name hq.example.local
!
! VULN (MGMT-007): SSH version 1
ip ssh version 1
! VULN (CRYPTO-002): weak SSH ciphers and MACs
ip ssh server algorithm encryption aes128-cbc 3des-cbc
ip ssh server algorithm mac hmac-sha1 hmac-md5
!
! VULN (MGMT-002): HTTP management server
ip http server
!
! VULN (CRYPTO-001): weak VPN proposal (DES, MD5, DH group 2)
crypto isakmp policy 10
 encr des
 hash md5
 authentication pre-share
 group 2
!
interface GigabitEthernet0/0/0
 description WAN-UPLINK-TO-ISP
 ip address 203.0.113.6 255.255.255.252
 ip access-group OUTSIDE-IN in
 cdp enable
 negotiation auto
!
interface GigabitEthernet0/0/1
 description LAN-USERS
 ip address 10.20.30.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no ip directed-broadcast
 negotiation auto
!
ip access-list extended OUTSIDE-IN
 permit tcp any host 203.0.113.6 eq 443
 deny ip any any log
!
ip access-list standard MGMT-ONLY
 permit 10.20.99.0 0.0.0.255
 deny any log
!
ip route 0.0.0.0 0.0.0.0 203.0.113.5
!
logging host 10.20.99.50
logging trap informational
!
ntp authentication-key 1 md5 NtpKey2026
ntp authenticate
ntp trusted-key 1
ntp server 10.20.99.10 key 1
!
line con 0
 exec-timeout 5 0
 logging synchronous
!
! VULN (MGMT-001): Telnet allowed on the VTY lines
! VULN (MGMT-006): exec-timeout 0 0 disables the idle timeout
line vty 0 4
 access-class MGMT-ONLY in
 exec-timeout 0 0
 login local
 transport input telnet ssh
!
end
