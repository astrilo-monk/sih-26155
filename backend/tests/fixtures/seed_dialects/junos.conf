system {
    host-name JUNOS-SEED-01;

    login {
        class operators {
            idle-timeout 10;
            permissions [ view configure ];
        }
        user netops {
            uid 2001;
            class operators;
        }
    }

    services {
        ssh {
            protocol-version v2;
        }
        telnet;
        web-management {
            http;
        }
    }

    syslog {
        host 198.51.100.55 {
            any notice;
        }
        file messages {
            any notice;
        }
    }

    ntp {
        server 198.51.100.44;
    }
}

protocols {
    lldp {
        interface all;
    }
}
