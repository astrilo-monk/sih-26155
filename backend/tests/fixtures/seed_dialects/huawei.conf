sysname HUAWEI-SEED-01
#
telnet server enable
http server enable
#
info-center loghost 198.51.100.55
#
ntp-service unicast-server 198.51.100.44
ntp-service authentication enable
#
user-interface vty 0 4
 idle-timeout 10 0
 protocol inbound all
#
snmp-agent sys-info version v3
#
ssh server-source protocol-version 2
acl-policy management trusted-host 10.9.9.0
header login information "Authorized access only"
#
interface GigabitEthernet0/0/1
 ip address 10.9.9.1 255.255.255.0
