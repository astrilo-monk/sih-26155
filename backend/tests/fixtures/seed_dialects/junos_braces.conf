/* the settings of junos_set.conf, written as brace blocks */
system {
    host-name JUNOS-SET-SEED-01;
    tacplus-server {
        198.51.100.30 timeout 5;
    }
    syslog {
        host 198.51.100.55 {
            any notice;
        }
    }
    ntp {
        server 198.51.100.44 key 1;
    }
    login {
        class OPS {
            idle-timeout 10;
        }
        retry-options {
            tries-before-disconnect 10;
        }
        password {
            minimum-length 6;
        }
    }
}
snmp {
    community public {
        authorization read-only;
    }
}
