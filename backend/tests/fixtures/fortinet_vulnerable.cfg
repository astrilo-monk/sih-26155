# config-version=FG100F-7.0.5-FW-build0304-220124:opmode=nat:vdom=root:0
# conf_file_ver=2148283460830761274
# buildno=0304
# global_vdom=1
config system global
    set hostname "FG-FW-01"
    set admintimeout 480
    set admin-ssh-v1 enable
    set pre-login-banner disable
    set gui-theme mariner
end
config system settings
    set opmode nat
    set ip-src-routing enable
    set ssl-min-proto-ver tls1-0
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh http telnet
        set type physical
        set lldp-transmission tx-rx
        set role wan
        set snmp-index 1
    next
    edit "internal"
        set vdom "root"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
        set snmp-index 2
    next
end
config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
        set query-v1-status enable
        set query-v2c-status enable
        set query-v1-port 161
        set query-v2c-port 161
        set trap-v1-status enable
        set trap-v2c-status enable
        set trap-v1-port 162
        set trap-v2c-port 162
        set events info
    next
end
config log syslogd setting
    set status disable
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "pool.ntp.org"
        next
    end
end
config vpn ipsec phase1-interface
    edit "vpn-to-branch"
        set interface "wan1"
        set peertype any
        set net-device disable
        set proposal 3des-md5
        set dhgrp 2
        set remote-gw 203.0.113.20
        set psksecret "vpnpassword123"
    next
end
config firewall policy
    edit 1
        set name "Allow-All-WAN-to-LAN"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "Allow-All-Any"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
