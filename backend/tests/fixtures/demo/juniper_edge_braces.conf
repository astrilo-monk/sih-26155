/* Demo: a Juniper SRX edge in brace (hierarchical) format, written for NetAuditAI */
system {
    host-name JUN-EDGE-01;
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$demo$hashedpasswordvalue";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
        }
        telnet;
        web-management {
            http {
                interface ge-0/0/0.0;
            }
        }
    }
    syslog {
        file messages {
            any notice;
        }
    }
    ntp {
        server 192.0.2.123;
    }
}
snmp {
    community jun-mon1tor {
        authorization read-only;
    }
}
