set deviceconfig system hostname PA-DC-FW01
set deviceconfig system type static
set deviceconfig system ip-address 10.50.0.10
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.50.0.1
set deviceconfig system domain dc.example.local
set deviceconfig system update-server updates.paloaltonetworks.com
set deviceconfig system dns-setting servers primary 10.50.0.53
set deviceconfig system timezone Asia/Kolkata
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-http no
set deviceconfig system service disable-https no
set deviceconfig system service disable-ssh no
set deviceconfig system ssh service protocol-version v1
set deviceconfig setting management idle-timeout 0
set deviceconfig system snmp-setting access-setting version v2c snmp-community-string public
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.50.0.123
set deviceconfig system ntp-servers primary-ntp-server authentication-type none
set network profiles interface-management-profile UNTRUST-MGMT telnet yes
set network profiles interface-management-profile UNTRUST-MGMT http yes
set network profiles interface-management-profile UNTRUST-MGMT https yes
set network profiles interface-management-profile UNTRUST-MGMT ping yes
set network profiles interface-management-profile UNTRUST-MGMT permitted-ip 0.0.0.0/0
set network interface ethernet ethernet1/1 layer3 ip 198.51.100.2/30
set network interface ethernet ethernet1/1 layer3 interface-management-profile UNTRUST-MGMT
set network interface ethernet ethernet1/1 layer3 lldp enable yes
set network interface ethernet ethernet1/2 layer3 ip 10.50.10.1/24
set zone untrust network layer3 ethernet1/1
set zone trust network layer3 ethernet1/2
set network virtual-router default interface [ ethernet1/1 ethernet1/2 ]
set network virtual-router default routing-table ip static-route default destination 0.0.0.0/0 nexthop ip-address 198.51.100.1
set network ike crypto-profiles ike-crypto-profiles LEGACY-IKE encryption des
set network ike crypto-profiles ike-crypto-profiles LEGACY-IKE hash md5
set network ike crypto-profiles ike-crypto-profiles LEGACY-IKE dh-group group1
set network ike crypto-profiles ipsec-crypto-profiles LEGACY-IPSEC esp encryption des
set network ike crypto-profiles ipsec-crypto-profiles LEGACY-IPSEC esp authentication md5
set mgt-config users admin phash $1$abcdefgh$0123456789ABCDEFGHIJKL
set mgt-config users admin permissions role-based superuser yes
set rulebase security rules Allow-All from any
set rulebase security rules Allow-All to any
set rulebase security rules Allow-All source any
set rulebase security rules Allow-All destination any
set rulebase security rules Allow-All application any
set rulebase security rules Allow-All service any
set rulebase security rules Allow-All action allow
set rulebase security rules Allow-Web from trust to untrust source any destination any application web-browsing service application-default action allow
