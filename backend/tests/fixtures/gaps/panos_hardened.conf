set deviceconfig system hostname PA-EDGE-02
set deviceconfig system type static
set deviceconfig system ip-address 10.30.0.21
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.30.0.1
set deviceconfig system permitted-ip 10.30.50.0/24
set deviceconfig system permitted-ip 10.30.51.10
set deviceconfig system dns-setting servers primary 192.0.2.53
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 192.0.2.123
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key key-id 1
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system login-banner "Authorized access only"
set deviceconfig system timezone UTC
set deviceconfig setting management idle-timeout 10
set mgt-config users admin phash $5$TEST-REDACTED
set mgt-config users admin permissions role-based superuser yes
set network interface ethernet ethernet1/1 layer3 ip 198.51.100.21/29
set network interface ethernet ethernet1/2 layer3 ip 10.30.1.1/24
set zone untrust network layer3 ethernet1/1
set zone trust network layer3 ethernet1/2
set rulebase security rules allow-web from trust
set rulebase security rules allow-web to untrust
set rulebase security rules allow-web source 10.30.1.0/24
set rulebase security rules allow-web destination any
set rulebase security rules allow-web application [ web-browsing ssl ]
set rulebase security rules allow-web service application-default
set rulebase security rules allow-web action allow
