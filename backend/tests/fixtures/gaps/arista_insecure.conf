! Command: show running-config
! device: SW-CORE-01 (DCS-7050SX3-48YC8, EOS-4.28.3M)
!
hostname SW-CORE-01
!
username admin privilege 15 role network-admin secret sha512 $6$TEST-REDACTED
username backup privilege 15 nopassword
!
ntp server 192.0.2.123
!
logging host 192.0.2.60
!
management telnet
   no shutdown
!
management api http-commands
   protocol http
   no shutdown
!
interface Ethernet1
   no switchport
   ip address 198.51.100.30/30
!
end
