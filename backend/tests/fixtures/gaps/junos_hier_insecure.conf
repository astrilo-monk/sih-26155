## Last changed: 2026-09-30 10:12:44 UTC
version 21.4R3.15;
system {
    host-name SRX-EDGE-01;
    root-authentication {
        encrypted-password "$6$TEST-REDACTED"; ## SECRET-DATA
    }
    login {
        class netops {
            permissions all;
        }
        user ops {
            uid 2001;
            class netops;
            authentication {
                encrypted-password "$6$TEST-REDACTED"; ## SECRET-DATA
            }
        }
    }
    services {
        ssh {
            root-login allow;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        host 192.0.2.50 {
            any notice;
        }
        file messages {
            any notice;
        }
    }
    ntp {
        server 192.0.2.10;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.20.0.1/24;
            }
        }
    }
}
security {
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone trust {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ssh;
                        }
                    }
                }
            }
        }
    }
    policies {
        from-zone untrust to-zone trust {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}
