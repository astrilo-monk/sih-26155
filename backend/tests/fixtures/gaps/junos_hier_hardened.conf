## Last changed: 2026-09-30 10:40:02 UTC
version 21.4R3.15;
system {
    host-name SRX-EDGE-02;
    root-authentication {
        encrypted-password "$6$TEST-REDACTED"; ## SECRET-DATA
    }
    login {
        retry-options {
            tries-before-disconnect 3;
            backoff-threshold 1;
            backoff-factor 5;
            lockout-period 15;
        }
        class netops {
            idle-timeout 5;
            permissions all;
        }
        user ops {
            uid 2001;
            class netops;
            authentication {
                encrypted-password "$6$TEST-REDACTED"; ## SECRET-DATA
            }
        }
        message "Authorized access only. Activity is monitored and logged.";
    }
    services {
        ssh {
            root-login deny;
            protocol-version v2;
        }
    }
    syslog {
        host 192.0.2.50 {
            any notice;
        }
    }
    ntp {
        authentication-key 1 type sha256 value "$9$TEST-REDACTED"; ## SECRET-DATA
        server 192.0.2.10 key 1;
        trusted-key 1;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 198.51.100.2/30;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.20.0.1/24;
            }
        }
    }
}
security {
    address-book {
        global {
            address internal-net 10.20.0.0/24;
            address web-dmz 198.51.100.64/27;
        }
    }
    zones {
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
        security-zone trust {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ssh;
                        }
                    }
                }
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy web-out {
                match {
                    source-address internal-net;
                    destination-address web-dmz;
                    application [ junos-http junos-https ];
                }
                then {
                    permit;
                }
            }
        }
    }
}
