! Command: show running-config
! device: SW-CORE-02 (DCS-7050SX3-48YC8, EOS-4.28.3M)
!
hostname SW-CORE-02
!
username admin privilege 15 role network-admin secret sha512 $6$TEST-REDACTED
username backup privilege 15 role network-operator secret sha512 $6$TEST-REDACTED
!
ntp authenticate
ntp authentication-key 1 sha1 7 TEST-REDACTED
ntp trusted-key 1
ntp server 192.0.2.123 key 1
!
logging host 192.0.2.60
!
management telnet
   shutdown
!
management api http-commands
   protocol https
   no shutdown
!
interface Ethernet1
   no switchport
   ip address 198.51.100.30/30
!
end
