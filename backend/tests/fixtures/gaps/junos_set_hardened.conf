set version 21.4R3.15
set system host-name SRX-EDGE-12
set system root-authentication encrypted-password "$6$TEST-REDACTED"
set system login retry-options tries-before-disconnect 3
set system login retry-options backoff-threshold 1
set system login retry-options backoff-factor 5
set system login retry-options lockout-period 15
set system login class netops idle-timeout 5
set system login class netops permissions all
set system login user ops uid 2001
set system login user ops class netops
set system login user ops authentication encrypted-password "$6$TEST-REDACTED"
set system login message "Authorized access only. Activity is monitored and logged."
set system services ssh root-login deny
set system services ssh protocol-version v2
set system syslog host 192.0.2.50 any notice
set system ntp authentication-key 1 type sha256 value "$9$TEST-REDACTED"
set system ntp server 192.0.2.10 key 1
set system ntp trusted-key 1
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.2/30
set interfaces ge-0/0/1 unit 0 family inet address 10.20.0.1/24
set security address-book global address internal-net 10.20.0.0/24
set security address-book global address web-dmz 198.51.100.64/27
set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services ssh
set security policies from-zone trust to-zone untrust policy web-out match source-address internal-net
set security policies from-zone trust to-zone untrust policy web-out match destination-address web-dmz
set security policies from-zone trust to-zone untrust policy web-out match application junos-https
set security policies from-zone trust to-zone untrust policy web-out then permit
