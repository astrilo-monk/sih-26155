#
 sysname HW-AR6120-02
#
 info-center loghost 192.0.2.60
#
aaa
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 local-user admin password irreversible-cipher TEST-REDACTED
 local-user admin privilege level 15
 local-user admin service-type ssh
#
acl number 2001
 rule 5 permit source 10.10.50.0 0.0.0.255
 rule 10 deny
#
acl number 3000
 rule 5 permit tcp source 10.10.0.0 0.0.255.255 destination 198.51.100.0 0.0.0.255 destination-port eq 443
 rule 100 deny ip
#
interface GigabitEthernet0/0/1
 ip address 198.51.100.6 255.255.255.252
 traffic-filter inbound acl 3000
#
 stelnet server enable
#
ntp-service authentication enable
ntp-service authentication-keyid 1 authentication-mode hmac-sha256 cipher TEST-REDACTED
ntp-service reliable authentication-keyid 1
ntp-service unicast-server 192.0.2.30 authentication-keyid 1
#
user-interface vty 0 4
 acl 2001 inbound
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 5 0
#
return
