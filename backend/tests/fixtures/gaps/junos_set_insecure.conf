set version 21.4R3.15
set system host-name SRX-EDGE-11
set system root-authentication encrypted-password "$6$TEST-REDACTED"
set system login class netops permissions all
set system login user ops uid 2001
set system login user ops class netops
set system login user ops authentication encrypted-password "$6$TEST-REDACTED"
set system services ssh root-login allow
set system services ssh protocol-version v2
set system services netconf ssh
set system syslog host 192.0.2.50 any notice
set system syslog file messages any notice
set system ntp server 192.0.2.10
set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.2/30
set interfaces ge-0/0/1 unit 0 family inet address 10.20.0.1/24
set security zones security-zone untrust interfaces ge-0/0/0.0
set security zones security-zone trust interfaces ge-0/0/1.0 host-inbound-traffic system-services ssh
set security policies from-zone untrust to-zone trust policy allow-all match source-address any
set security policies from-zone untrust to-zone trust policy allow-all match destination-address any
set security policies from-zone untrust to-zone trust policy allow-all match application any
set security policies from-zone untrust to-zone trust policy allow-all then permit
