#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890
#buildno=1639
#global_vdom=1
config system global
    set hostname "FGT-BRANCH-01"
    set admintimeout 5
    set timezone 04
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.1.1 255.255.255.0
        set allowaccess ping https ssh http
        set type hard-switch
        set role lan
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "192.0.2.123"
        next
    end
end
