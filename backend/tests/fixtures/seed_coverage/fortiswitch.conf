#config-version=FS1D24-7.2.3-FW-build0453-230306:user=admin
config system global
    set hostname "FSW-1"
    set admintimeout 5
end
config system interface
    edit "mgmt"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
    next
end
config switch interface
    edit "port1"
        set native-vlan 10
    next
    edit "port2"
        set native-vlan 10
    next
end
config switch vlan
    edit 10
    next
end
config router static
    edit 1
        set gateway 192.168.1.1
    next
end
config system global
    set admin-lockout-threshold 3
    set strong-crypto enable
end
config system global
    set admin-ssh-v1 disable
    set pre-login-banner "Authorized access only. Activity is monitored."
end
config system password-policy
    set status enable
    set minimum-length 12
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2Qd9pLk2mYb7wN1c4Vx8zR3tS6uJ0eK5hF2gD9aQ
    next
    edit "tacacs-admin"
        set remote-auth enable
        set accprofile "super_admin"
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config log syslogd setting
    set status enable
    set server "192.0.2.50"
end
config system ntp
    set ntpsync enable
    set authentication enable
    config ntpserver
        edit 1
            set server "192.0.2.10"
        next
    end
end
