hostname NX-CORE-01
feature telnet
feature nxapi
nxapi http port 80
ssh cipher-mode weak
username admin password 5 $5$KdPqLx7m$Yb7wN1c4Vx8zR3tS6uJ0eK5hF2gD9aQ role network-admin
userpassphrase min-length 16
ssh login-attempts 3
tacacs-server host 192.0.2.60
aaa authentication login default group TACACS-GROUP local
