sysname CORE-VRP-01
telnet server enable
http server enable
info-center loghost 192.0.2.50
ntp-service unicast-server 192.0.2.10
ntp-service authentication enable
snmp-agent community read public
header login information "Authorized access only."
undo ip source-route
undo lldp enable
undo icmp redirect send
ssh server authentication-retries 3
acl number 3000
 rule 5 permit source any
aaa
 local-user admin password irreversible-cipher $1c$Qd9pLk2m$Yb7wN1c4Vx8z$
 local-user admin privilege level 15
 authentication-scheme default
  authentication-mode hwtacacs local
user-interface vty 0 4
 idle-timeout 10 0
 acl 2000 inbound
ike proposal 10
 encryption-algorithm aes-256
 authentication-algorithm sha1
 dh group2
