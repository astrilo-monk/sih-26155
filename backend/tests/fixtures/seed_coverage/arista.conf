hostname LEAF-EOS-01
!
management telnet
   shutdown
no management telnet
management http-commands
ip ssh version 2
management ssh
   idle-timeout 15
   ip access-group MGMT-IN in
management security
   password minimum length 15
aaa authentication policy lockout failure 3 duration 900
aaa authentication login default group TACACS local
username admin privilege 15 secret 0 $6$Qd9pLk2m$Yb7wN1c4Vx8z
banner login
snmp-server community public ro
logging host 192.0.2.50 514 protocol udp
ntp server 192.0.2.10 prefer
ntp authenticate
no ip source-route
lldp run
ip access-list WAN-IN
   10 permit ip any any
interface Ethernet1
   no lldp transmit
   no ip redirects
   ip proxy-arp
