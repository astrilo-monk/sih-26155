set system host-name EDGE-MX-01
set system services telnet
set system services web-management http
set system services ssh protocol-version v2
set system login retry-options tries-before-disconnect 3
set system login password minimum-length 15
set system login class ADMIN idle-timeout 5
set system login class ADMIN allow-sources 192.0.2.0/24
set system login message "Authorized access only."
set system login user admin class super-user
set system login user admin authentication encrypted-password "$6$Qd9pLk2m$Yb7wN1c4Vx8zR3tS6uJ0eK5hF2gD9aQ"
set system authentication-order [ tacplus password ]
set system tacplus-server 192.0.2.60 timeout 5
set system syslog host 192.0.2.50 any notice
set system ntp server 192.0.2.10 prefer
set system ntp authentication-key 1 type sha256 value "$9$Qd9pLk2mYb7wN1c4"
set system ntp trusted-key 1
set system no-redirects
set system services ssh ciphers aes256-ctr
set system services ssh ciphers aes256-cbc
set system services ssh macs hmac-sha2-256
set security ike proposal IKE-P1 authentication-method pre-shared-keys
set security ike proposal IKE-P1 dh-group group2
set security ike proposal IKE-P1 authentication-algorithm sha1
set security ike proposal IKE-P1 encryption-algorithm 3des-cbc
set security ipsec proposal IPSEC-P1 protocol esp
set security ipsec proposal IPSEC-P1 encryption-algorithm aes-256-cbc
set security ipsec proposal IPSEC-P1 authentication-algorithm hmac-sha-256-128
set snmp community public authorization read-only
set security zones security-zone untrust host-inbound-traffic system-services ssh
set protocols lldp disable
