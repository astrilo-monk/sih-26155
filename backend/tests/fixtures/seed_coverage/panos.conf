set deviceconfig system hostname PA-EDGE-01
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-http no
set deviceconfig system ssh service protocol-version v2
set deviceconfig system permitted-ip 192.0.2.0/24
set deviceconfig setting management idle-timeout 30
set deviceconfig setting management admin-lockout failed-attempts 5
set mgt-config password-complexity minimum-length 12
set mgt-config users admin phash $1$abcdefgh$ijklmnopqrstuv
set mgt-config users admin permissions role-based superuser yes
set deviceconfig system login-banner "Authorized access only."
set shared server-profile tacplus TACACS-MGMT server TAC1 address 192.0.2.60
set deviceconfig system snmp-setting access-setting version v2c snmp-community-string public
set shared log-settings syslog SYSLOG-PROFILE server SYS1 server 192.0.2.50
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 192.0.2.10
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key
set network interface ethernet ethernet1/1 layer3 lldp enable no
set rulebase security rules ALLOW-WEB log-end yes
set network profiles zone-protection-profile ZP-UNTRUST discard-strict-source-routing yes
set network profiles zone-protection-profile ZP-UNTRUST discard-loose-source-routing no
set deviceconfig system ssh profiles mgmt-profiles server-profiles HARDENED ciphers aes128-cbc
set network ike crypto-profiles ike-crypto-profiles IKE-LEGACY encryption 3des
set network ike crypto-profiles ike-crypto-profiles IKE-LEGACY hash sha1
set network ike crypto-profiles ike-crypto-profiles IKE-LEGACY dh-group group2
set zone untrust network layer3 ethernet1/1
