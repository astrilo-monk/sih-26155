configure snmp sysName "SW-EXOS-01"
disable telnet
disable web
configure ssh2 inactivity-timeout 600
configure ssh2 access-profile MGMT-SSH
configure account admin encrypted $5$Qd9pLk2m$Yb7wN1c4Vx8z
configure banner before-login
configure syslog add 192.0.2.50 local0
configure ntp-client add server 192.0.2.10
configure snmp add community public
disable lldp ports all
configure access-list ipcontrol MGMT-SSH add 10 permit ip any any
configure cli max-failed-logins 3
configure account all password-policy min-length 12
configure tacacs primary server 192.0.2.60 client-ip 192.0.2.5 vr VR-Mgmt
enable tacacs
enable ip-option loose-source-route
disable icmp redirects vlan all
configure ntp server add 192.0.2.10 key 1
enable ntp authentication
