hostname R1
!
enable secret 9 $9$abc
username admin privilege 15 secret 9 $9$abc
!
aaa new-model
aaa authentication login default local
!
interface GigabitEthernet0/0
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.0.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 ip address 10.0.2.1 255.255.255.0
 shutdown
!
ip ssh version 2
logging host 10.0.0.9
ntp server 10.0.0.1
!
line vty 0 4
 transport input ssh
 exec-timeout 5 0
!
end
remote-console state enabled
remote-console protocol telnet
remote-console source-policy unrestricted
audit-stream state enabled
audit-stream destination 10.44.60.20
time-sync state enabled
time-sync server 10.44.70.10
secure-channel ipsec enabled
secure-channel encryption aes256
