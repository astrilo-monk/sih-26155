!Command: show running-config
version 9.3(8) Bios:version 05.44
hostname nx-leaf1
feature ssh
feature tacacs+
feature interface-vlan
feature lacp
username admin password 5 $5$abc$def role network-admin
ip domain-lookup
ip access-list MGMT
  10 permit ip 10.0.0.0/8 any
snmp-server user admin network-admin auth md5 0xabc priv 0xdef localizedkey
ntp server 10.0.0.1 use-vrf management
vlan 1,10,20
vrf context management
  ip route 0.0.0.0/0 10.0.0.1
interface Vlan10
  no shutdown
  ip address 10.10.0.1/24
interface Ethernet1/1
  switchport
  switchport mode trunk
interface Ethernet1/2
  switchport
  switchport mode trunk
interface Ethernet1/3
  switchport
interface Ethernet1/4
  switchport
interface mgmt0
  vrf member management
  ip address 192.168.0.10/24
line console
  exec-timeout 10
line vty
  exec-timeout 10
  access-class MGMT in
boot nxos bootflash:/nxos.9.3.8.bin
