!! IOS XR Configuration 7.3.2
hostname xr-pe1
logging 10.0.0.5 vrf default severity info
username admin
 group root-lr
 group cisco-support
 secret 5 $1$abcd$efgh
!
line default
 transport input ssh
!
vty-pool default 0 4
ntp
 server 10.0.0.1
!
interface Loopback0
 ipv4 address 10.255.0.1 255.255.255.255
!
interface MgmtEth0/RP0/CPU0/0
 ipv4 address 192.168.0.1 255.255.255.0
!
interface GigabitEthernet0/0/0/0
 ipv4 address 10.1.1.1 255.255.255.252
!
interface GigabitEthernet0/0/0/1
 shutdown
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 10.1.1.2
 !
!
router ospf 1
 area 0
  interface Loopback0
 !
!
ssh server v2
ssh server vrf default
end
