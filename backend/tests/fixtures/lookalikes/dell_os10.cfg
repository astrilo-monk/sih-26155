! Version 10.5.2.3
hostname os10-leaf
username admin password $6$abcdefgh role sysadmin
ip ssh server enable
snmp-server community public ro
ntp server 10.0.0.1
!
interface vlan1
 no shutdown
!
interface ethernet1/1/1
 no shutdown
 switchport access vlan 1
!
interface ethernet1/1/2
 no shutdown
 switchport access vlan 1
!
interface ethernet1/1/3
 no shutdown
 switchport access vlan 1
!
interface mgmt1/1/1
 no shutdown
 ip address 192.168.0.5/24
!
ip access-list MGMT
 seq 10 permit ip 10.0.0.0/8 any
!
line vty
 ip access-class MGMT
!
logging server 10.0.0.9
