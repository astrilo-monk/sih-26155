! Command: show running-config
! device: leaf1 (DCS-7050SX3-48YC8, EOS-4.28.3M)
!
no aaa root
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf1
ip name-server vrf MGMT 10.0.0.53
dns domain example.net
!
spanning-tree mode mstp
!
enable secret sha512 $6$Rn0example$abcdefgh
aaa authorization exec default local
!
username admin privilege 15 role network-admin secret sha512 $6$example$hash
!
vrf instance MGMT
!
interface Ethernet1
   description spine1
   no switchport
   ip address 10.1.1.1/31
!
interface Ethernet2
   description spine2
   no switchport
   ip address 10.1.1.3/31
!
interface Loopback0
   ip address 10.0.0.11/32
!
interface Management1
   vrf MGMT
   ip address 192.168.0.11/24
!
ip access-list MGMT-ACL
   10 permit ip 192.168.0.0/24 any
   20 deny ip any any log
!
ip routing
no ip routing vrf MGMT
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
ntp server vrf MGMT 10.0.0.123
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
management ssh
   idle-timeout 15
   authentication mode password
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=10.0.0.5:9910 -taillogs
   no shutdown
!
router bgp 65011
   router-id 10.0.0.11
   neighbor 10.1.1.0 remote-as 65000
!
end
