===== 15_realistic_branch.cfg =====
!
version 15.2
hostname BRANCH-15
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
enable secret 9 $9$HASH
username netops privilege 15 secret 9 $9$HASH
ip domain-name branch.example
ip ssh version 2
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
logging buffered 16384 warnings
logging host 10.50.0.10
logging host 10.50.0.11
ntp server 10.50.0.20
ntp server 10.50.0.21
!
snmp-server group NMS v3 priv
snmp-server user nms NMS v3 auth sha AUTH priv aes 128 PRIV
!
no ip http server
no ip http secure-server
!
banner login ^CPrivate network. Authorized users only.^C
!
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ONLY in
!
ip access-list standard MGMT-ONLY
 permit 10.50.10.0 0.0.0.255
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.15 255.255.255.252
 ip access-group WAN-IN in
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description USERS
 ip address 10.15.0.1 255.255.255.0
 no shutdown
!
ip access-list extended WAN-IN
 permit tcp any host 203.0.113.15 eq 22
 deny ip any any log
!
end
