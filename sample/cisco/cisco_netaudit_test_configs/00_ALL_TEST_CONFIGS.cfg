===== 01_secure_baseline.cfg =====
!
! Secure baseline
!
hostname CORE-RTR-01
service password-encryption
enable secret 9 $9$EXAMPLEHASH
username netadmin privilege 15 secret 9 $9$EXAMPLEHASH
ip domain-name corp.example
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
aaa new-model
aaa authentication login default local
aaa authorization exec default local
login block-for 120 attempts 3 within 60
banner login ^CUnauthorized access prohibited.^C
logging host 10.20.0.50
logging trap warnings
service timestamps log datetime msec
ntp server 10.20.0.20
snmp-server group NMS v3 priv
snmp-server user monitor NMS v3 auth sha AUTHHASH priv aes 128 PRIVHASH
no ip http server
no ip http secure-server
no cdp enable
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ACCESS in
!
ip access-list standard MGMT-ACCESS
 permit 10.20.10.0 0.0.0.255
!
interface GigabitEthernet0/0
 description INTERNET
 ip address 203.0.113.10 255.255.255.0
 no cdp enable
 ip access-group OUTSIDE-IN in
 no shutdown
!
ip access-list extended OUTSIDE-IN
 deny ip any any log
!
end

