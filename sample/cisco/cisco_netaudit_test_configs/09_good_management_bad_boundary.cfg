!
hostname MIXED-RTR-09
service password-encryption
enable secret 9 $9$HASH
username admin privilege 15 secret 9 $9$HASH
aaa new-model
aaa authentication login default local
ip domain-name corp.example
ip ssh version 2
no ip http server
no ip http secure-server
banner login ^CUnauthorized.^C
logging host 10.10.10.50
ntp server 10.10.10.20
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
!
interface GigabitEthernet0/0
 description INTERNET
 ip address 203.0.113.30 255.255.255.0
 cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description INTERNAL
 ip address 10.9.0.1 255.255.255.0
 no shutdown
end
