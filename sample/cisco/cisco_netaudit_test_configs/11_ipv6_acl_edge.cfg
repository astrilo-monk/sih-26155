!
hostname IPV6-EDGE-11
username admin privilege 15 secret 9 $9$HASH
enable secret 9 $9$HASH
aaa new-model
aaa authentication login default local
ip ssh version 2
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
!
ipv6 access-list OUTSIDE-V6
 permit ipv6 any any
!
interface GigabitEthernet0/0
 description INTERNET
 ipv6 address 2001:db8:11::1/64
 ipv6 traffic-filter OUTSIDE-V6 in
 no shutdown
end
