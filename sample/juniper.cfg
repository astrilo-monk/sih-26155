## NetAuditAI Juniper test configuration
## Intentionally insecure: 5 target security problems
##
## Problem 1: Telnet management enabled
## Problem 2: Plain HTTP management enabled
## Problem 3: Default SNMP community "public"
## Problem 4: NTP server configured without authentication
## Problem 5: SSH/login class has no idle timeout

system {
    host-name NETAUDIT-JUNOS-TEST;

    login {
        class ops {
            permissions [ view ];
            idle-timeout 0;
        }

        user netops {
            uid 2001;
            class ops;
            authentication {
                encrypted-password <SECRET:password>;
            }
        }
    }

    services {
        ssh {
            protocol-version v2;
        }

        telnet;

        web-management {
            http;
        }
    }

    snmp {
        community public {
            authorization read-only;
        }
    }

    ntp {
        server 192.0.2.10;
    }
}
