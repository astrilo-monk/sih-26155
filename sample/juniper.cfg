system {
    host-name JUNIPER-EDGE-01;

    root-authentication {
        encrypted-password "$6$example$abcdefghijklmnopqrstuv";
    }

    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$example$adminpassword";
            }
        }

        user netops {
            uid 2001;
            class operator;
            authentication {
                encrypted-password "$6$example$netopspassword";
            }
        }
    }

    services {
        ssh {
            root-login allow;
            protocol-version v2;
        }

        telnet;
        ftp;
        web-management {
            http;
        }
    }

    syslog {
        user * {
            any emergency;
        }

        file messages {
            any notice;
            authorization info;
        }
    }

    ntp {
        server 192.168.10.10;
    }
}

interfaces {
    ge-0/0/0 {
        description "WAN Interface";
        unit 0 {
            family inet {
                address 203.0.113.2/30;
            }
        }
    }

    ge-0/0/1 {
        description "LAN Interface";
        unit 0 {
            family inet {
                address 192.168.1.1/24;
            }
        }
    }
}

routing-options {
    static {
        route 0.0.0.0/0 next-hop 203.0.113.1;
    }
}

protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/1.0;
        }
    }

    lldp {
        interface all;
    }
}

firewall {
    family inet {
        filter BLOCK-INBOUND {
            term ALLOW-SSH {
                from {
                    source-address {
                        192.168.1.0/24;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }

            term BLOCK-TELNET {
                from {
                    protocol tcp;
                    destination-port telnet;
                }
                then discard;
            }

            term DEFAULT-DROP {
                then discard;
            }
        }
    }
}

security {
    screen {
        ids-option untrust-screen {
            tcp {
                syn-flood;
                land;
            }

            icmp {
                ping-death;
            }
        }
    }

    policies {
        from-zone trust to-zone untrust {
            policy allow-web {
                match {
                    source-address any;
                    destination-address any;
                    application [ junos-http junos-https ];
                }
                then {
                    permit;
                }
            }
        }
    }
}