!
! SAMPLE LAB CONFIGURATION
! Deliberately contains insecure settings for testing a network
! security auditing application. Do NOT use in production.
!
hostname EDGE-RTR-01

!
! SSH / management
!
ip domain-name example.local
username admin privilege 15 password 0 admin123
enable password admin123

line vty 0 4
 login local
 transport input telnet ssh
 access-class MGMT-ACCESS in

!
! Management ACL
! WARNING: permits management access from anywhere
!
ip access-list standard MGMT-ACCESS
 permit 0.0.0.0 255.255.255.255

!
! SNMP
! WARNING: weak/default community string
!
snmp-server community public RO

!
! Logging
! WARNING: no remote logging configured
!
no logging host

!
! Interfaces
!
interface GigabitEthernet0/0
 description INTERNET
 ip address 203.0.113.10 255.255.255.0
 ip access-group OUTSIDE-IN in
 no shutdown

interface GigabitEthernet0/1
 description INTERNAL
 ip address 10.10.0.1 255.255.255.0
 no shutdown

!
! Firewall ACL
! WARNING: overly permissive inbound rule
!
ip access-list extended OUTSIDE-IN
 permit ip any any
 permit tcp any any eq 22
 permit tcp any any eq 23

!
! HTTP management
! WARNING: insecure web management enabled
!
ip http server
ip http authentication local

!
! Unencrypted remote administration is enabled above.
!
end
