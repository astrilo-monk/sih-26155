## NetAuditAI Juniper test configuration - remediated
## Every problem in juniper.cfg fixed:
##
## Fix 1: Telnet management removed (SSH v2 only)
## Fix 2: Plain HTTP management replaced by HTTPS
## Fix 3: Default SNMP community replaced, restricted to the management network
## Fix 4: NTP server authenticated with a trusted key
## Fix 5: Login class idle timeout set to 10 minutes
## Plus: remote syslog, TACACS+ AAA, login banner, management access filter,
##       source routing off, LLDP off

system {
    host-name NETAUDIT-JUNOS-TEST;

    login {
        message "Authorized access only. Activity is monitored and logged.";
        class ops {
            permissions [ view ];
            idle-timeout 10;
        }

        user netops {
            uid 2001;
            class ops;
            authentication {
                encrypted-password <SECRET:password>;
            }
        }
    }

    authentication-order tacplus;
    tacplus-server {
        10.10.0.20 secret <SECRET:tacplus>;
    }

    services {
        ssh {
            protocol-version v2;
        }

        web-management {
            https {
                system-generated-certificate;
            }
        }
    }

    syslog {
        host 10.10.0.50 {
            any info;
        }
    }

    ntp {
        authentication-key 1 type sha256 value <SECRET:ntpkey>;
        trusted-key 1;
        server 192.0.2.10 key 1;
    }

    no-source-route;
}

snmp {
    community Nt4udit-R0 {
        authorization read-only;
        clients {
            10.10.0.0/24;
        }
    }
}

protocols {
    lldp {
        disable;
    }
}

firewall {
    filter PROTECT-MGMT {
        term ALLOW-MGMT {
            from {
                source-address {
                    10.10.0.0/24;
                }
                protocol tcp;
                destination-port [ ssh https ];
            }
            then accept;
        }
        term ALLOW-SNMP {
            from {
                source-address {
                    10.10.0.0/24;
                }
                protocol udp;
                destination-port snmp;
            }
            then accept;
        }
        term ALLOW-NTP {
            from {
                source-address {
                    192.0.2.10/32;
                }
                protocol udp;
                port ntp;
            }
            then accept;
        }
        term DENY-ALL {
            then {
                discard;
            }
        }
    }
}

interfaces {
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input PROTECT-MGMT;
                }
            }
        }
    }
}
