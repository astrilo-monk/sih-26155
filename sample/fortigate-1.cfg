config system global
    set hostname "FORTIGATE-EDGE-01"
    set admin-https-ssl-versions tlsv1-2
    set admin-https-redirect enable
    set admintimeout 5
    set admin-ssh-grace-time 30
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC ExampleEncryptedPassword
        set trustedhost1 192.168.1.0 255.255.255.0
    next
end

config system interface
    edit "wan1"
        set ip 203.0.113.1 255.255.255.252
        set allowaccess ping http https ssh telnet
        set type physical
        set role wan
    next

    edit "lan"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
end

config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "192.168.10.10"
        next
    end
end

config log syslogd setting
    set status enable
    set server "192.168.10.20"
    set port 514
    set mode udp
end

config firewall address
    edit "LAN-NET"
        set subnet 192.168.1.0 255.255.255.0
    next

    edit "ANY-ADDRESS"
        set subnet 0.0.0.0 0.0.0.0
    next
end

config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN-NET"
        set dstaddr "ANY-ADDRESS"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next

    edit 2
        set name "WAN-Management"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "ANY-ADDRESS"
        set dstaddr "ANY-ADDRESS"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config system snmp sysinfo
    set status enable
    set description "FORTIGATE-EDGE-01"
end

config system dns
    set primary 1.1.1.1
    set secondary 8.8.8.8
end