snmp {
    community public {
        authorization read-only;
    }

    community private {
        authorization read-write;
    }
}

interfaces {
    ge-0/0/0 {
        description "WAN Interface";
        unit 0 {
            family inet {
                address 203.0.113.2/30;
            }
        }
    }

    ge-0/0/1 {
        description "LAN Interface";
        unit 0 {
            family inet {
                address 192.168.20.1/24;
            }
        }
    }
}

routing-options {
    static {
        route 0.0.0.0/0 next-hop 203.0.113.1;
    }
}

protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/1.0;
        }
    }

    lldp {
        interface all;
    }
}

firewall {
    family inet {
        filter PROTECT-RE {
            term ALLOW-MGMT {
                from {
                    source-address {
                        192.168.20.0/24;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }

            term DEFAULT-DROP {
                then discard;
            }
        }
    }
}

security {
    policies {
        from-zone trust to-zone untrust {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}
