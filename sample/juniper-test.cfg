version 21.4R3.15;
system {
    host-name JUNIPER-TEST-02;

    root-authentication {
        encrypted-password "$6$testseed$Ux0nRqLpQ2mVkT8sYbHwCfZ1gJdNeAoIrXuP";
    }

    login {
        message "Authorized access only. All activity is monitored and recorded.";

        class ops-restricted {
            idle-timeout 10;
            permissions [ view view-configuration ];
        }

        user netops {
            uid 2001;
            class ops-restricted;
            authentication {
                encrypted-password "$6$testseed$Mb7kQwZzTvRs2LcXpAeHnUdFgYjOiKlW";
            }
        }

        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$testseed$Pq9wErTyUiOpAsDfGhJkLzXcVbNmQwEr";
            }
        }
    }

    authentication-order [ radius password ];

    radius-server {
        192.0.2.30 {
            port 1812;
            secret "$9$testseedRadiusSharedKey";
        }
    }

    services {
        ssh {
            protocol-version v2;
            root-login deny;
            connection-limit 10;
        }

        telnet;

        web-management {
            http;
            https {
                system-generated-certificate;
            }
        }
    }

    syslog {
        host 192.0.2.20 {
            any notice;
            authorization info;
        }

        file messages {
            any notice;
        }
    }

    ntp {
        authentication-key 1 type sha256 value "$9$testseedNtpSharedKey";
        trusted-key [ 1 ];
        server 192.0.2.10 key 1;
    }
