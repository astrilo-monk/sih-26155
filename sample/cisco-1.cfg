!
version 15.2
hostname CISCO-EDGE-01
!
enable secret 5 $1$abc123$ExampleHashValue
!
username admin privilege 15 secret 5 $1$xyz789$AnotherExampleHash
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip domain-name example.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
ip http secure-server
!
no ip source-route
!
service password-encryption
security passwords min-length 10
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
!
banner motd ^
********************************************************
* WARNING: Authorized access only.                    *
* All activity may be monitored and logged.            *
********************************************************
^
!
logging buffered 16384 informational
logging host 192.168.10.20
logging trap informational
service timestamps log datetime msec
service timestamps debug datetime msec
!
ntp authenticate
ntp authentication-key 10 md5 ExampleNTPKey
ntp trusted-key 10
ntp server 192.168.10.10 key 10
!
snmp-server group SECURE v3 priv
!
ip access-list extended MANAGEMENT-ACL
 permit tcp 192.168.1.0 0.0.0.255 any eq 22
 deny ip any any log
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.2 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 ip access-group MANAGEMENT-ACL in
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 192.168.1.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.1.0 0.0.0.255 area 0
!
line console 0
 login authentication default
 exec-timeout 5 0
!
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
 access-class MANAGEMENT-ACL in
!
line vty 5 15
 login authentication default
 transport input ssh
 exec-timeout 10 0
 access-class MANAGEMENT-ACL in
!
end