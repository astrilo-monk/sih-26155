remote-console state enabled
remote-console protocol telnet
remote-console source-policy unrestricted
remote-console encryption disabled

secure-channel ipsec enabled
secure-channel ike-version 2
secure-channel encryption aes256
secure-channel integrity sha256
secure-channel peer-validation enabled

boundary-policy outside-to-inside default deny
boundary-policy inside-to-dmz default deny
