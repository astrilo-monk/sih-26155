system-name CORE-GATE-07

platform-family NX-SECURE
release 8.4.2

interface uplink0
 description "Internet transit"
 address 198.51.100.10/30
 speed 10000
 duplex full

interface users0
 description "Corporate users"
 address 10.44.10.1/24

interface servers0
 description "Application servers"
 address 10.44.20.1/24

routing static 0.0.0.0/0 next-hop 198.51.100.9
routing ospf process 200
routing ospf area 0

object network USERS
object network SERVERS
object network DMZ

management-plane secure-access enabled
management-plane secure-access protocol ssh
management-plane legacy-access disabled

secure-shell protocol-version 2
secure-shell cipher-suite modern
secure-shell hostkey-size minimum 3072
secure-shell forwarding client disabled
secure-shell forwarding agent disabled

operator inactivity-lock 600
operator failed-auth threshold 5
operator failed-auth quarantine 180
operator privilege restricted

credential-policy minimum-size 15
credential-policy complexity enforced
credential-policy reuse-count 10
credential-policy lifetime 90

identity-services centralized-authentication enabled
identity-services radius primary 10.44.50.10
identity-services radius secondary 10.44.50.11
identity-services authorization command-level enabled

audit-stream state enabled
audit-stream transport encrypted
audit-stream destination 10.44.60.20
audit-stream integrity verification enabled

time-sync state enabled
time-sync authenticated enabled
time-sync server 10.44.70.10

control-plane defense enabled
control-plane rate-guard 1200
control-plane invalid-source action discard
control-plane malformed-packet action discard

management-plane source-restriction enabled
