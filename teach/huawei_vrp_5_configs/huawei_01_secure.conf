sysname HUAWEI-CORE-01

aaa
 local-user netadmin password irreversible-cipher TEST-REDACTED
 local-user netadmin privilege level 15
 local-user netadmin service-type ssh
 authentication-scheme default
 authorization-scheme default
 domain default

stelnet server enable
ssh server authentication-type default password
ssh server timeout 10
undo telnet server enable
undo http server enable

snmp-agent
snmp-agent community read cipher TEST-REDACTED mib-view iso-view
snmp-agent sys-info version v3
snmp-agent acl 2000

info-center enable
info-center loghost 10.70.50.20
info-center loghost 10.70.50.21

ntp-service enable
ntp-service unicast-server 10.70.60.10
ntp-service unicast-server 10.70.60.11
ntp-service authentication enable

header login information "AUTHORIZED ACCESS ONLY. ACTIVITY IS MONITORED."

acl number 2000
 rule 5 permit source 10.70.10.0 0.0.0.255
 rule 10 deny

undo ip source-route
lldp enable

interface GigabitEthernet0/0/1
 description CORE-UPLINK
 undo shutdown

interface GigabitEthernet0/0/2
 description SERVER-NETWORK
 undo shutdown

interface MEth0/0/0
 description OUT-OF-BAND-MANAGEMENT
 ip address 10.70.10.21 255.255.255.0
 undo shutdown
