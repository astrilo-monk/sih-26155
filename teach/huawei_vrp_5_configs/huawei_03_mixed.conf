#
# Huawei VRP security compliance fixture - Mixed posture
# Representative test fixture, not a vendor-exported production configuration
#
sysname HUAWEI-DIST-MIXED

aaa
 local-user netops password irreversible-cipher TEST-REDACTED
 local-user netops privilege level 15
 local-user netops service-type ssh
 authentication-scheme default
 authorization-scheme default

stelnet server enable
ssh server timeout 20
undo telnet server enable
http server enable

snmp-agent
snmp-agent community read cipher TEST-REDACTED

info-center enable
info-center loghost 10.80.50.20
info-center loghost 10.80.50.21

ntp-service enable
ntp-service unicast-server 10.80.60.10

header login information "AUTHORIZED ADMINISTRATORS ONLY."

acl number 2010
 rule 5 permit source 10.80.10.0 0.0.0.255
 rule 10 deny

undo ip source-route
lldp enable

interface GigabitEthernet0/0/1
 description CORE-UPLINK
 undo shutdown

interface GigabitEthernet0/0/10
 description INTERNET-EDGE
 undo shutdown

interface MEth0/0/0
 ip address 10.80.10.31 255.255.255.0
 undo shutdown
#
