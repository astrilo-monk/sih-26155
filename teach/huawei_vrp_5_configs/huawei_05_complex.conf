#
# Huawei VRP security compliance fixture - Complex
# Representative test fixture, not a vendor-exported production configuration
#
sysname HUAWEI-BORDER-COMPLEX

aaa
 local-user secops password irreversible-cipher TEST-REDACTED
 local-user secops privilege level 15
 local-user secops service-type ssh
 local-user netops password irreversible-cipher TEST-REDACTED
 local-user netops privilege level 15
 local-user netops service-type ssh
 local-user readonly password irreversible-cipher TEST-REDACTED
 local-user readonly privilege level 5
 local-user readonly service-type ssh
 authentication-scheme default
 authorization-scheme default
 domain default

stelnet server enable
ssh server authentication-type default password
ssh server timeout 15
undo telnet server enable
undo http server enable

snmp-agent
snmp-agent community read cipher TEST-REDACTED mib-view iso-view
snmp-agent sys-info version v3
snmp-agent acl 2030

info-center enable
info-center loghost 10.90.50.10
info-center loghost 10.90.50.11
info-center loghost 10.90.50.12

ntp-service enable
ntp-service unicast-server 10.90.60.10
ntp-service unicast-server 10.90.60.11
ntp-service authentication enable

header login information "AUTHORIZED ACCESS ONLY. SECURITY EVENTS MAY BE RECORDED."

acl number 2030
 rule 5 permit source 10.90.10.0 0.0.0.255
 rule 10 permit source 10.90.11.0 0.0.0.255
 rule 20 deny

acl number 2040
 rule 5 deny source 10.90.0.0 0.0.255.255
 rule 10 permit
 rule 20 deny

undo ip source-route
lldp enable

interface GigabitEthernet0/0/1
 description INTERNET-UPLINK
 undo shutdown

interface GigabitEthernet0/0/2
 description INTERNAL-CORE
 undo shutdown

interface GigabitEthernet0/0/3
 description SECURITY-SENSOR
 undo shutdown

interface GigabitEthernet0/0/4
 description SERVER-FARM
 undo shutdown

interface MEth0/0/0
 description OUT-OF-BAND
 ip address 10.90.10.21 255.255.255.0
 undo shutdown
#
