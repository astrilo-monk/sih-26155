#
# Huawei VRP security compliance fixture - Production-style
# Representative test fixture, not a vendor-exported production configuration
#
sysname HUAWEI-DC-CORE-01

aaa
 local-user automation password irreversible-cipher TEST-REDACTED
 local-user automation privilege level 15
 local-user automation service-type ssh
 local-user noc password irreversible-cipher TEST-REDACTED
 local-user noc privilege level 15
 local-user noc service-type ssh
 authentication-scheme default
 authorization-scheme default
 domain default

stelnet server enable
ssh server authentication-type default password
ssh server timeout 10
undo telnet server enable
undo http server enable

snmp-agent
snmp-agent community read cipher TEST-REDACTED mib-view iso-view
snmp-agent sys-info version v3
snmp-agent acl 2020

info-center enable
info-center loghost 172.16.50.10
info-center loghost 172.16.50.11

ntp-service enable
ntp-service unicast-server 172.16.60.10
ntp-service unicast-server 172.16.60.11
ntp-service authentication enable

header login information "PRIVATE NETWORK. AUTHORIZED ADMINISTRATORS ONLY."

acl number 2020
 rule 5 permit source 172.16.10.0 0.0.0.255
 rule 10 deny

undo ip source-route
lldp enable

interface GigabitEthernet0/0/1
 description SPINE-LINK-1
 undo shutdown

interface GigabitEthernet0/0/2
 description SPINE-LINK-2
 undo shutdown

interface GigabitEthernet0/0/3
 description SERVER-FABRIC
 undo shutdown

interface MEth0/0/0
 description OOB-MANAGEMENT
 ip address 172.16.10.21 255.255.255.0
 undo shutdown
#
