#
# Huawei VRP security compliance fixture - Intentionally insecure
# Representative test fixture, not a vendor-exported production configuration
#
sysname HUAWEI-LAB-INSECURE

aaa
 local-user admin password simple TEST-REDACTED
 local-user admin privilege level 15
 local-user admin service-type telnet

stelnet server enable
ssh server timeout 60
telnet server enable
http server enable

snmp-agent
snmp-agent community read public
snmp-agent community write private

# No remote logging configured.
# No authenticated NTP configured.

header login information "LAB DEVICE"

acl number 2000
 rule 5 permit source any

ip source-route
lldp enable

interface GigabitEthernet0/0/1
 description WAN
 undo shutdown

interface MEth0/0/0
 ip address 192.168.100.10 255.255.255.0
 undo shutdown
#
