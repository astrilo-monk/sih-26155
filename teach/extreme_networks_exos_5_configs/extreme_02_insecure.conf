# Extreme Networks EXOS security compliance fixture - Intentionally insecure
# Representative test fixture, not a vendor-exported production configuration
configure snmp add community public
configure snmp add community private

configure syslog delete 10.100.60.20
configure ntp-client delete server all

enable ssh
configure ssh2 inactivity-timeout 3600
enable telnet
enable web

configure account admin encrypted TEST-REDACTED

configure banner before-login
LAB SWITCH
EOF

configure access-list ipcontrol MGMT-SSH add 10 permit ip any any
configure access-list ipcontrol EDGE-IN add 10 permit ip any any

enable iparp-proxy
enable lldp ports all

configure vlan Default ipaddress 192.168.100.10/24
configure ports 1:1 display-string WAN
enable ports 1:1
