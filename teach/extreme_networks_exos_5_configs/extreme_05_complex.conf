# Extreme Networks EXOS security compliance fixture - Complex
# Representative test fixture, not a vendor-exported production configuration
configure snmp add community observe
configure snmp add trapreceiver 10.120.50.10
configure snmp add trapreceiver 10.120.50.11

configure syslog add 10.120.60.10 local5
configure syslog add 10.120.60.11 local5
configure syslog add 10.120.60.12 local5

configure ntp-client add server 10.120.70.10
configure ntp-client add server 10.120.70.11
enable ntp-client

enable ssh2
configure ssh2 access-profile OOB-MGMT
configure ssh2 inactivity-timeout 900
disable telnet
disable web

configure account secops encrypted TEST-REDACTED
configure account netops encrypted TEST-REDACTED
configure account readonly encrypted TEST-REDACTED

configure banner before-login
============================================================
AUTHORIZED ACCESS ONLY
SECURITY EVENTS MAY BE RECORDED AND REVIEWED
============================================================
EOF

configure access-list ipcontrol OOB-MGMT add 10 permit tcp 10.120.10.0/24 any destination-port 22
configure access-list ipcontrol OOB-MGMT add 20 permit tcp 10.120.11.0/24 any destination-port 22
configure access-list ipcontrol OOB-MGMT add 30 deny ip any any

configure access-list ipcontrol OOB-SNMP add 10 permit ip 10.120.50.10/32 any
configure access-list ipcontrol OOB-SNMP add 20 permit ip 10.120.50.11/32 any
configure access-list ipcontrol OOB-SNMP add 30 deny ip any any

configure access-list ipcontrol EDGE-IN add 10 deny ip 10.120.0.0/16 any
configure access-list ipcontrol EDGE-IN add 20 permit tcp any any destination-port 443
configure access-list ipcontrol EDGE-IN add 30 permit udp any any destination-port 53
configure access-list ipcontrol EDGE-IN add 40 deny ip any any

configure vlan MGMT tag 120
configure vlan MGMT ipaddress 10.120.10.21/24

configure ports 1:1 display-string INTERNET-UPLINK
enable ports 1:1
configure ports 1:2 display-string INTERNAL-CORE
enable ports 1:2
configure ports 1:3 display-string SECURITY-SENSOR
enable ports 1:3
configure ports 1:4 display-string SERVER-FARM
enable ports 1:4

disable lldp ports 1:1
disable lldp ports 1:2
