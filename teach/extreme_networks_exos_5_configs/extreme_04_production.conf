# Extreme Networks EXOS security compliance fixture - Production-style
# Representative test fixture, not a vendor-exported production configuration
configure snmp add community monitoring
configure snmp add trapreceiver 172.16.50.10
configure snmp add trapreceiver 172.16.50.11

configure syslog add 172.16.50.20 local4
configure syslog add 172.16.50.21 local4

configure ntp-client add server 172.16.60.10
configure ntp-client add server 172.16.60.11
enable ntp-client

enable ssh2
configure ssh2 access-profile OOB-SSH
configure ssh2 inactivity-timeout 600
disable telnet
disable web

configure account automation encrypted TEST-REDACTED
configure account noc encrypted TEST-REDACTED

configure banner before-login
************************************************************
PRIVATE NETWORK. AUTHORIZED ADMINISTRATORS ONLY.
UNAUTHORIZED ACCESS IS PROHIBITED AND LOGGED.
************************************************************
EOF

configure access-list ipcontrol OOB-SSH add 10 permit tcp 172.16.10.0/24 any destination-port 22
configure access-list ipcontrol OOB-SSH add 20 deny ip any any

configure access-list ipcontrol OOB-SNMP add 10 permit ip 172.16.50.10/32 any
configure access-list ipcontrol OOB-SNMP add 20 permit ip 172.16.50.11/32 any
configure access-list ipcontrol OOB-SNMP add 30 deny ip any any

configure vlan MGMT tag 160
configure vlan MGMT ipaddress 172.16.10.21/24

configure ports 1:1 display-string SPINE-LINK-1
enable ports 1:1
configure ports 1:2 display-string SPINE-LINK-2
enable ports 1:2
configure ports 1:3 display-string SERVER-FABRIC
enable ports 1:3
disable lldp ports 1:1-1:3
