# Extreme Networks EXOS security compliance fixture - Secure
# Representative test fixture, not a vendor-exported production configuration
configure snmp add community readonly
configure snmp add trapreceiver 10.100.50.20
configure snmp add trapreceiver 10.100.50.21

configure syslog add 10.100.60.20 local0
configure syslog add 10.100.60.21 local0

configure ntp-client add server 10.100.70.10
configure ntp-client add server 10.100.70.11
enable ntp-client

enable ssh2
configure ssh2 access-profile MGMT-SSH
configure ssh2 inactivity-timeout 600
disable telnet
disable web

configure account admin encrypted TEST-REDACTED

configure banner before-login
============================================================
AUTHORIZED ACCESS ONLY. ACTIVITY MAY BE MONITORED.
============================================================
EOF

configure access-list ipcontrol MGMT-SSH add 10 permit tcp 10.100.10.0/24 any destination-port 22
configure access-list ipcontrol MGMT-SSH add 20 deny ip any any

disable iparp-proxy
disable network-clock
disable lldp ports all

configure vlan MGMT tag 100
configure vlan MGMT ipaddress 10.100.10.21/24

configure ports 1:1 display-string UPLINK
enable ports 1:1
configure ports 1:2 display-string SERVER-NETWORK
enable ports 1:2
