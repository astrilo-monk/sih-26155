# Extreme Networks EXOS security compliance fixture - Mixed posture
# Representative test fixture, not a vendor-exported production configuration
configure snmp add community NMS-READONLY
configure snmp add trapreceiver 10.110.50.20

configure syslog add 10.110.60.20 local0
configure syslog add 10.110.60.21 local0

configure ntp-client add server 10.110.70.10
enable ntp-client

enable ssh2
configure ssh2 inactivity-timeout 1200
disable telnet
enable web

configure account netops encrypted TEST-REDACTED

configure banner before-login
AUTHORIZED ADMINISTRATORS ONLY.
EOF

configure access-list ipcontrol SNMP-SOURCES add 10 permit ip 10.110.50.20/32 any
configure access-list ipcontrol SNMP-SOURCES add 20 deny ip any any

configure access-list ipcontrol USER-EDGE add 10 permit tcp 10.110.0.0/16 any destination-port 443
configure access-list ipcontrol USER-EDGE add 20 deny ip any any

configure vlan MGMT tag 110
configure vlan MGMT ipaddress 10.110.10.31/24

configure ports 1:1 display-string CORE-UPLINK
enable ports 1:1
configure ports 1:10 display-string INTERNET-EDGE
enable ports 1:10

enable lldp ports all
