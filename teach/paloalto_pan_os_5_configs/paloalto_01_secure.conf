set deviceconfig system hostname PA-EDGE-01
set deviceconfig system type static
set deviceconfig system ip-address 192.0.2.10
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 192.0.2.1
set deviceconfig system dns-setting servers primary 192.0.2.53
set deviceconfig system dns-setting servers secondary 192.0.2.54
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 192.0.2.123
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key
set deviceconfig system login-banner "AUTHORIZED ACCESS ONLY. ACTIVITY IS MONITORED."
set deviceconfig system permitted-ip 192.0.2.0/24
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system service disable-https yes
set deviceconfig system ssh service enable yes
set deviceconfig system ssh service protocol-version v2
set deviceconfig system session-timeout 10
set deviceconfig system snmp-setting access-setting version v3
set deviceconfig system syslog-service server 192.0.2.60
set deviceconfig system syslog-service server 192.0.2.61
set mgt-config password-complexity enabled yes
set mgt-config password-complexity minimum-length 14
set mgt-config password-complexity minimum-uppercase-letters 1
set mgt-config password-complexity minimum-lowercase-letters 1
set mgt-config password-complexity minimum-numeric-letters 1
set mgt-config password-complexity minimum-special-characters 1
set network interface ethernet ethernet1/1 layer3 ip 192.0.2.10/24
set network interface ethernet ethernet1/1 layer3 interface-management-profile MGMT-HTTPS-SSH
set network profiles interface-management-profile MGMT-HTTPS-SSH permitted-ip 192.0.2.0/24
set network profiles interface-management-profile MGMT-HTTPS-SSH https yes
set network profiles interface-management-profile MGMT-HTTPS-SSH ssh yes
set network profiles interface-management-profile MGMT-HTTPS-SSH ping no
