! Arista EOS security compliance fixture - Intentionally insecure
! Representative test configuration, not a vendor-exported production file
hostname LAB-LEAF-INSECURE

username admin privilege 15 secret 0 TEST-REDACTED

aaa authentication login default local

ip ssh version 1
management ssh
   idle-timeout 3600

management telnet
management http-commands

snmp-server community public ro
snmp-server community private rw

! No remote syslog configured
! No authenticated NTP configured

banner login
LAB DEVICE
EOF

ip access-list MGMT-SSH-IN
   10 permit ip any any

ip access-list WAN-FILTER
   10 permit ip any any

ip source-routing

interface Ethernet1
   description WAN
   no shutdown

interface Management1
   ip address 192.168.100.10/24
   no shutdown

lldp run

!
