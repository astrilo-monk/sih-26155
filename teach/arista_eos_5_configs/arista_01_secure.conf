! Arista EOS security compliance fixture - Secure
! Representative test configuration, not a vendor-exported production file
hostname EDGE-LEAF-01

username netadmin privilege 15 role network-admin secret 0 TEST-REDACTED

aaa authentication login default local
aaa authorization exec default local

ip ssh version 2
management ssh
   ip access-group MGMT-SSH-IN in
   idle-timeout 900

no management telnet
no management http-commands

snmp-server community READONLY ro access MGMT-SNMP
snmp-server group NMS v3 priv

logging host 10.10.50.20
logging facility local6

ntp server 10.10.50.10
ntp server 10.10.50.11
ntp authenticate
ntp trusted-key 1

banner login
************************************************************************
* AUTHORIZED ACCESS ONLY. ALL ACTIVITY IS MONITORED.                  *
************************************************************************
EOF

ip access-list MGMT-SSH-IN
   10 permit tcp 10.10.10.0/24 any eq ssh
   20 deny ip any any

ip access-list MGMT-SNMP
   10 permit ip host 10.10.50.20 any
   20 deny ip any any

no ip source-routing

interface Ethernet1
   description UPLINK-TO-CORE
   no shutdown

interface Ethernet2
   description SERVER-NETWORK
   no shutdown

interface Management1
   description OUT-OF-BAND-MANAGEMENT
   ip address 10.10.10.21/24
   no shutdown

lldp run
no lldp transmit Management1
no lldp receive Management1

!
