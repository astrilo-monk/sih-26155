! Arista EOS security compliance fixture - Production-style
! Representative test configuration, not a vendor-exported production file
hostname DC-SPINE-01

username automation privilege 15 role network-admin secret 0 TEST-REDACTED
username noc privilege 15 role network-admin secret 0 TEST-REDACTED

aaa authentication login default local
aaa authorization exec default local

ip ssh version 2
management ssh
   ip access-group OOB-SSH in
   idle-timeout 600

no management telnet
no management http-commands

snmp-server community MONITORING ro access OOB-SNMP
snmp-server group MONITORING-V3 v3 priv

logging host 172.16.50.10
logging host 172.16.50.11
logging facility local5

ntp server 172.16.50.20
ntp server 172.16.50.21
ntp authenticate
ntp trusted-key 10

banner login
************************************************************
* PRIVATE NETWORK. AUTHORIZED ADMINISTRATORS ONLY.         *
* UNAUTHORIZED ACCESS IS PROHIBITED AND LOGGED.            *
************************************************************
EOF

ip access-list OOB-SSH
   10 permit tcp 172.16.10.0/24 any eq ssh
   20 deny ip any any

ip access-list OOB-SNMP
   10 permit ip host 172.16.50.10 any
   20 permit ip host 172.16.50.11 any
   30 deny ip any any

no ip source-routing

interface Ethernet1
   description SPINE-LINK-1
   no shutdown

interface Ethernet2
   description SPINE-LINK-2
   no shutdown

interface Ethernet3
   description SPINE-LINK-3
   no shutdown

interface Management1
   description OOB-MANAGEMENT
   ip address 172.16.10.21/24
   no shutdown

lldp run

!
