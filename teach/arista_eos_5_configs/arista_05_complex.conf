! Arista EOS security compliance fixture - Complex
! Representative test configuration, not a vendor-exported production file
hostname BORDER-LEAF-COMPLEX

username secops privilege 15 role network-admin secret 0 TEST-REDACTED
username netops privilege 15 role network-admin secret 0 TEST-REDACTED
username readonly privilege 5 role network-operator secret 0 TEST-REDACTED

aaa authentication login default local
aaa authorization exec default local

ip ssh version 2
management ssh
   ip access-group OOB-MGMT in
   idle-timeout 900

no management telnet
no management http-commands

snmp-server community OBSERVE ro access OOB-SNMP
snmp-server group TELEMETRY v3 priv

logging host 10.30.50.10
logging host 10.30.50.11
logging host 10.30.50.12
logging facility local4

ntp server 10.30.60.10
ntp server 10.30.60.11
ntp authenticate
ntp trusted-key 20
ntp trusted-key 21

banner login
==============================================================
 AUTHORIZED ACCESS ONLY
 SECURITY EVENTS MAY BE RECORDED AND REVIEWED
==============================================================
EOF

ip access-list OOB-MGMT
   10 permit tcp 10.30.10.0/24 any eq ssh
   20 permit tcp 10.30.11.0/24 any eq ssh
   30 deny ip any any

ip access-list OOB-SNMP
   10 permit ip host 10.30.50.10 any
   20 permit ip host 10.30.50.11 any
   30 deny ip any any

ip access-list EDGE-IN
   10 deny ip 10.30.0.0/16 any
   20 permit tcp any any eq https
   30 permit udp any any eq domain
   40 deny ip any any

no ip source-routing

interface Ethernet1
   description INTERNET-UPLINK
   ip access-group EDGE-IN in
   no shutdown

interface Ethernet2
   description INTERNAL-CORE
   no shutdown

interface Ethernet3
   description SECURITY-SENSOR
   no shutdown

interface Ethernet4
   description SERVER-FARM
   no shutdown

interface Port-Channel10
   description CORE-LAG
   no shutdown

interface Management1
   description OUT-OF-BAND
   ip address 10.30.10.21/24
   no shutdown

lldp run
no lldp transmit Management1
no lldp receive Management1

!
