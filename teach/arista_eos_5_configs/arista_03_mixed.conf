! Arista EOS security compliance fixture - Mixed posture
! Representative test configuration, not a vendor-exported production file
hostname DISTRIBUTION-MIXED

username ops privilege 15 role network-admin secret 0 TEST-REDACTED

aaa authentication login default local
aaa authorization exec default local

ip ssh version 2
management ssh
   idle-timeout 1200

no management telnet
management http-commands

snmp-server community NMS-READ ro access SNMP-SOURCES

logging host 10.20.50.20
logging host 10.20.50.21

ntp server 10.20.50.10

banner login
AUTHORIZED PERSONNEL ONLY
EOF

ip access-list SNMP-SOURCES
   10 permit ip host 10.20.50.20 any
   20 permit ip host 10.20.50.21 any
   30 deny ip any any

ip access-list USER-EDGE
   10 permit tcp 10.20.0.0/16 any eq https
   20 deny ip any any

! Source routing intentionally left enabled for fixture coverage
ip source-routing

interface Ethernet1
   description CORE-UPLINK
   no shutdown

interface Ethernet10
   description INTERNET-EDGE
   no shutdown

interface Management1
   ip address 10.20.10.31/24
   no shutdown

lldp run

!
