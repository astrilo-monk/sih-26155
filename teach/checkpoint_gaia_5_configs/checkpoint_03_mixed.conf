# Check Point Gaia security compliance fixture - Mixed posture
# Representative test fixture, not a vendor-exported production configuration
set hostname CP-DIST-MIXED

set interface eth0 ipv4-address 10.50.10.21 mask-length 24
set interface eth1 ipv4-address 10.50.20.1 mask-length 24

set ssh server enabled true
set ssh server session-timeout 1200
set telnet-server enabled false
set web-server enabled true

set snmp agent on
set snmp community NMS-READONLY
set snmp allowed-source 10.50.50.20

set syslog remote 10.50.60.10
set ntp active on
set ntp server primary 10.50.70.10

set login-banner "AUTHORIZED ADMINISTRATORS ONLY."

set access-rule 10 source 10.50.10.0/24 destination any service ssh action accept
set access-rule 20 source any destination any service https action accept
set access-rule 30 source any destination any service any action drop

set source-routing disabled
set lldp enabled true

# HTTP management is intentionally enabled for mixed-posture testing.
