# Check Point Gaia security compliance fixture - Intentionally insecure
# Representative test fixture, not a vendor-exported production configuration
set hostname CP-LAB-INSECURE
set interface eth0 ipv4-address 192.168.100.10 mask-length 24

set admin-shell /bin/bash
set ssh server enabled true
set ssh server port 22
set ssh server session-timeout 3600

set telnet-server enabled true
set web-server enabled true

set snmp agent on
set snmp community public
set snmp community private

# No remote syslog configured.
# No NTP authentication configured.

set login-banner "LAB GATEWAY"

set access-rule 10 source any destination any service any action accept

set source-routing enabled
set lldp enabled true
