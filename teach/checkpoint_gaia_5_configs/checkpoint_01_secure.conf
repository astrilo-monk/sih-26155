# Check Point Gaia security compliance fixture - Secure
# Representative test fixture, not a vendor-exported production configuration
set hostname CP-GW-01
set interface eth0 ipv4-address 10.40.10.21 mask-length 24
set interface eth1 ipv4-address 10.40.20.1 mask-length 24

set admin-shell /bin/bash
set ssh server enabled true
set ssh server port 22
set ssh server session-timeout 600

set telnet-server enabled false
set web-server enabled false

set ntp active on
set ntp server primary 10.40.50.10
set ntp server secondary 10.40.50.11

set syslog remote 10.40.60.10
set syslog remote 10.40.60.11

set snmp agent on
set snmp community readonly
set snmp allowed-source 10.40.50.20

set login-banner "AUTHORIZED ACCESS ONLY. ACTIVITY MAY BE MONITORED."

set access-rule 10 source 10.40.10.0/24 destination any service ssh action accept
set access-rule 20 source any destination any service any action drop

set source-routing disabled
set lldp enabled false

# Management access is restricted to the management subnet.
# Secrets are intentionally redacted for test use.
