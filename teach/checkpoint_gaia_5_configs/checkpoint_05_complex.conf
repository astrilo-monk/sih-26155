# Check Point Gaia security compliance fixture - Complex
# Representative test fixture, not a vendor-exported production configuration
set hostname CP-BORDER-COMPLEX

set interface eth0 ipv4-address 10.60.10.21 mask-length 24
set interface eth1 ipv4-address 10.60.20.1 mask-length 24
set interface eth2 ipv4-address 10.60.30.1 mask-length 24
set interface eth3 ipv4-address 10.60.40.1 mask-length 24

set ssh server enabled true
set ssh server port 22
set ssh server session-timeout 900
set telnet-server enabled false
set web-server enabled false

set snmp agent on
set snmp community OBSERVE
set snmp allowed-source 10.60.50.10
set snmp allowed-source 10.60.50.11

set syslog remote 10.60.60.10
set syslog remote 10.60.60.11
set syslog remote 10.60.60.12

set ntp active on
set ntp server primary 10.60.70.10
set ntp server secondary 10.60.70.11
set ntp authentication enabled true

set login-banner "AUTHORIZED ACCESS ONLY. SECURITY EVENTS MAY BE RECORDED."

set access-rule 10 source 10.60.10.0/24 destination any service ssh action accept
set access-rule 20 source 10.60.50.0/24 destination any service snmp action accept
set access-rule 30 source any destination any service https action accept
set access-rule 40 source 10.60.20.0/24 destination 10.60.30.0/24 service https action accept
set access-rule 50 source any destination any service any action drop

set source-routing disabled
set lldp enabled false

# Multiple interfaces and management sources are included to exercise
# generic block parsing, ACL extraction, and vendor-neutral controls.
