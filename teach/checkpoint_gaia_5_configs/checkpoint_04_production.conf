# Check Point Gaia security compliance fixture - Production-style
# Representative test fixture, not a vendor-exported production configuration
set hostname CP-DC-GW-01

set interface eth0 ipv4-address 172.16.10.21 mask-length 24
set interface eth1 ipv4-address 172.16.20.1 mask-length 24
set interface eth2 ipv4-address 172.16.30.1 mask-length 24

set ssh server enabled true
set ssh server port 22
set ssh server session-timeout 600
set telnet-server enabled false
set web-server enabled false

set snmp agent on
set snmp community MONITORING
set snmp allowed-source 172.16.50.10
set snmp allowed-source 172.16.50.11

set syslog remote 172.16.50.20
set syslog remote 172.16.50.21

set ntp active on
set ntp server primary 172.16.60.10
set ntp server secondary 172.16.60.11
set ntp authentication enabled true

set login-banner "PRIVATE NETWORK. AUTHORIZED ADMINISTRATORS ONLY."

set access-rule 10 source 172.16.10.0/24 destination any service ssh action accept
set access-rule 20 source 172.16.50.0/24 destination any service snmp action accept
set access-rule 30 source any destination any service https action accept
set access-rule 40 source any destination any service any action drop

set source-routing disabled
set lldp enabled false
