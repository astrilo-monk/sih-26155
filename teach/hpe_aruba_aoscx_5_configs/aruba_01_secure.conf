! HPE Aruba AOS-CX security compliance fixture - Secure
! Representative test configuration, not a vendor-exported production file
hostname ARUBA-LEAF-01
user admin group administrators password plaintext TEST-REDACTED
aaa authentication login default local
aaa authorization commands default local
ssh server vrf default
ssh server rate-limit 20
ssh server max-auth-attempts 3
ssh server timeout 600
no telnet server
no http vrf default
snmp-server community READONLY
logging 10.10.50.20
logging 10.10.50.21
ntp server 10.10.50.10
ntp server 10.10.50.11
ntp authentication enable
banner motd
****************************************************************
* AUTHORIZED ACCESS ONLY. ACTIVITY MAY BE MONITORED.           *
****************************************************************
EOF
access-list ip MGMT-SSH
   10 permit tcp 10.10.10.0/24 any eq ssh
   20 deny any any
access-list ip MGMT-SNMP
   10 permit ip 10.10.50.20 any
   20 deny any any
interface 1/1/1
   description UPLINK
   no shutdown
interface 1/1/2
   description SERVER-NETWORK
   no shutdown
interface mgmt
   ip static 10.10.10.21/24
   no shutdown
lldp enable
!
