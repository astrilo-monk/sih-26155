! HPE Aruba AOS-CX security compliance fixture - Intentionally insecure
! Representative test configuration, not a vendor-exported production file
hostname ARUBA-LAB-INSECURE
user admin group administrators password plaintext TEST-REDACTED
aaa authentication login default local
ssh server vrf default
ssh server timeout 3600
telnet server
http vrf default
snmp-server community public
snmp-server community private
banner motd
LAB SWITCH
EOF
access-list ip MGMT-SSH
   10 permit any any
access-list ip EDGE-IN
   10 permit any any
interface 1/1/1
   description WAN
   no shutdown
interface mgmt
   ip static 192.168.100.10/24
   no shutdown
lldp enable
!
