! HPE Aruba AOS-CX security compliance fixture - Mixed posture
! Representative test configuration, not a vendor-exported production file
hostname ARUBA-DIST-MIXED
user netops group administrators password plaintext TEST-REDACTED
aaa authentication login default local
aaa authorization commands default local
ssh server vrf default
ssh server timeout 1200
no telnet server
http vrf default
snmp-server community NMS-READONLY
logging 10.20.50.20
logging 10.20.50.21
ntp server 10.20.50.10
banner motd
AUTHORIZED ADMINISTRATORS ONLY
EOF
access-list ip SNMP-SOURCES
   10 permit ip 10.20.50.20 any
   20 permit ip 10.20.50.21 any
   30 deny any any
access-list ip USER-EDGE
   10 permit tcp 10.20.0.0/16 any eq https
   20 deny any any
interface 1/1/1
   description CORE-UPLINK
   no shutdown
interface 1/1/10
   description INTERNET-EDGE
   no shutdown
interface mgmt
   ip static 10.20.10.31/24
   no shutdown
lldp enable
!
