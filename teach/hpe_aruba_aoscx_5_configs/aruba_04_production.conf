! HPE Aruba AOS-CX security compliance fixture - Production-style
! Representative test configuration, not a vendor-exported production file
hostname ARUBA-DATACENTER-LEAF-01
user automation group administrators password plaintext TEST-REDACTED
user noc group administrators password plaintext TEST-REDACTED
aaa authentication login default local
aaa authorization commands default local
ssh server vrf default
ssh server timeout 600
ssh server max-auth-attempts 3
no telnet server
no http vrf default
snmp-server community MONITORING
logging 172.16.50.10
logging 172.16.50.11
ntp server 172.16.50.20
ntp server 172.16.50.21
ntp authentication enable
banner motd
************************************************************
* PRIVATE NETWORK. AUTHORIZED ADMINISTRATORS ONLY.         *
* UNAUTHORIZED ACCESS IS PROHIBITED AND LOGGED.            *
************************************************************
EOF
access-list ip OOB-MGMT
   10 permit tcp 172.16.10.0/24 any eq ssh
   20 deny any any
access-list ip OOB-SNMP
   10 permit ip 172.16.50.10 any
   20 permit ip 172.16.50.11 any
   30 deny any any
interface 1/1/1
   description SPINE-LINK-1
   no shutdown
interface 1/1/2
   description SPINE-LINK-2
   no shutdown
interface 1/1/3
   description SERVER-FABRIC
   no shutdown
interface mgmt
   description OOB-MANAGEMENT
   ip static 172.16.10.21/24
   no shutdown
lldp enable
!
