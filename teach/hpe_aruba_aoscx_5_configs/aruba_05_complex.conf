! HPE Aruba AOS-CX security compliance fixture - Complex
! Representative test configuration, not a vendor-exported production file
hostname ARUBA-BORDER-LEAF-COMPLEX
user secops group administrators password plaintext TEST-REDACTED
user netops group administrators password plaintext TEST-REDACTED
user readonly group operators password plaintext TEST-REDACTED
aaa authentication login default local
aaa authorization commands default local
ssh server vrf default
ssh server timeout 900
ssh server max-auth-attempts 3
ssh server rate-limit 20
no telnet server
no http vrf default
snmp-server community OBSERVE
logging 10.30.50.10
logging 10.30.50.11
logging 10.30.50.12
ntp server 10.30.60.10
ntp server 10.30.60.11
ntp authentication enable
banner motd
==============================================================
 AUTHORIZED ACCESS ONLY
 SECURITY EVENTS MAY BE RECORDED AND REVIEWED
==============================================================
EOF
access-list ip OOB-MGMT
   10 permit tcp 10.30.10.0/24 any eq ssh
   20 permit tcp 10.30.11.0/24 any eq ssh
   30 deny any any
access-list ip OOB-SNMP
   10 permit ip 10.30.50.10 any
   20 permit ip 10.30.50.11 any
   30 deny any any
access-list ip EDGE-IN
   10 deny ip 10.30.0.0/16 any
   20 permit tcp any any eq https
   30 permit udp any any eq domain
   40 deny any any
interface 1/1/1
   description INTERNET-UPLINK
   no shutdown
interface 1/1/2
   description INTERNAL-CORE
   no shutdown
interface 1/1/3
   description SECURITY-SENSOR
   no shutdown
interface 1/1/4
   description SERVER-FARM
   no shutdown
interface lag 10
   description CORE-LAG
   no shutdown
interface mgmt
   description OUT-OF-BAND
   ip static 10.30.10.21/24
   no shutdown
lldp enable
!
